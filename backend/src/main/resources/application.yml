spring:
  application:
    name: fleetmanager-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetmanager}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Devenir10@}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits-long}
    access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:1800000}   # 30 min
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 jours
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@fleetmanager.local}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.fleetmanager.backend: INFO
    org.springframework.security: WARN
