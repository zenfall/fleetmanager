version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetmanager}
      POSTGRES_USER: ${POSTGRES_USER:-fleetmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fleetmanager}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleetmanager-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetmanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleetmanager}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleetmanager}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleetmanager}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Definir APP_JWT_SECRET dans .env (min. 32 caracteres aleatoires)}
      APP_JWT_ACCESS_EXPIRATION_MS: ${APP_JWT_ACCESS_EXPIRATION_MS:-1800000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${APP_JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@fleetmanager.local}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?Definir APP_BOOTSTRAP_ADMIN_PASSWORD dans .env}
    ports:
      - '8080:8080'
    networks:
      - fleetmanager-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: fleetmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - fleetmanager-net

networks:
  fleetmanager-net:
    driver: bridge

volumes:
  postgres_data:
